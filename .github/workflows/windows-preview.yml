name: Windows preview (manual review)

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'config/**'
      - 'db/**'
      - 'gui/**'
      - 'img/**'
      - 'main.pyw'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable-preview:
    runs-on: windows-latest
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Financial tests
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test with SQLite and historical data (Windows)
        run: python tests/windows_gui_smoke.py
      - name: Capture actual front screenshots (fictional data)
        run: python tests/windows_front_screenshots.py
      - name: Upload real interface screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DCA-Frontend-Real-Screenshots-FIN05
          path: docs/front-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Publish screenshot files to development branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/fin05-explicit-usdt-trading-fees' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/front-screenshots/
          if (!(git diff --cached --quiet)) {
            git commit -m "docs(front): real Windows application screenshots with fictional data [skip ci]"
            git push origin "HEAD:refs/heads/feat/fin05-explicit-usdt-trading-fees"
          }
      - name: Build portable Windows preview
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DCA-Preview --collect-all customtkinter --add-data "config;config" --add-data "img;img" --add-data "db;db" main.pyw
          $app = "dist/DCA-Preview"
          if (!(Test-Path "$app/DCA-Preview.exe")) { throw "Executable not found" }
          $dataDir = "$app/_internal/db"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Copy-Item "tests/fixtures/preview_operacoes.csv" "$dataDir/meu_diario_operacoes.csv" -Force
          $configPath = "$app/_internal/config/config.json"
          $settings = Get-Content $configPath -Raw | ConvertFrom-Json
          $settings.moedas = @("BTC", "ETH", "SOL", "LINK", "USDT")
          $settings.intervalo_atualizacao = 60
          $settings.splash_timeout = 90
          $settings | ConvertTo-Json -Depth 10 | Set-Content $configPath -Encoding utf8
          New-Item -ItemType File -Path "$app/DCA-PREVIEW-MODE" -Force | Out-Null
          Copy-Item "docs/COMO_TESTAR_PREVIEW.txt" "$app/LEIA-ME-ANTES-DE-ABRIR.txt"
          if (!(Test-Path "$dataDir/meu_diario_operacoes.csv")) { throw "Demo CSV not packaged" }
      - name: Upload temporary Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: DCA-Integration-Internal-QA-Windows
          path: dist/DCA-Preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
