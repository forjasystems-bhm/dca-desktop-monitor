name: Windows integrated QA - no installer

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'config/**'
      - 'db/**'
      - 'gui/**'
      - 'img/**'
      - 'main.pyw'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/windows-preview.yml'

permissions:
  contents: read

jobs:
  portable-preview:
    runs-on: windows-latest
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow
      - name: Financial tests
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test with SQLite and historical data (Windows)
        run: python tests/windows_gui_smoke.py
      - name: Capture actual front screenshots (fictional data)
        run: python tests/windows_front_screenshots.py
      - name: Upload real interface screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DCA-Frontend-Real-Screenshots-FIN05
          path: docs/front-screenshots/
          if-no-files-found: error
          retention-days: 30
