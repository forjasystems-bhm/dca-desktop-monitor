name: Finance regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  financial-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run financial regression tests
        run: python -m unittest discover -s tests -v
